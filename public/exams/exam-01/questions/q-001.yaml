# Correct Answer
correctAnswer: "A"

# Explanation (shown after answer)
explanation: |
  **Đáp án đúng: A - They're looking at a computer screen.**

  Bức ảnh cho thấy hai người đang nhìn vào màn hình máy tính cùng nhau.

  **Phân tích các đáp án:**
  - (A) ✓ **Đúng** - Họ đang nhìn vào màn hình máy tính
  - (B) ✗ Sai - Họ đang ngồi cùng nhau, không phải ở bàn riêng
  - (C) ✗ Sai - Mặc dù họ có thể đang làm việc, nhưng không thể xác nhận đó là presentation
  - (D) ✗ Sai - Họ đang ngồi, không đứng

  **Mẹo làm bài:**
  - Chú ý động từ và hành động chính trong ảnh
  - Loại các đáp án mô tả sai vị trí hoặc hành động

